<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Raid Report Entry</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#174a7c;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0} header p{font-size:12px;margin:6px 0 0;opacity:.9}
nav{display:flex;gap:8px;padding:10px;background:#fff;position:sticky;top:78px;z-index:4;box-shadow:0 2px 8px #0001}
nav button{flex:1;border:0;border-radius:10px;padding:12px 8px;font-weight:bold;background:#e7eef6;color:#174a7c}
nav button.active{background:#174a7c;color:#fff}
main{padding:14px;max-width:700px;margin:auto}.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #00000012}
label{display:block;font-weight:bold;font-size:14px;margin:12px 0 6px}
input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:13px;font-size:16px;background:#fff}
textarea{min-height:86px;resize:vertical}.photo{border:2px dashed #8ab58d;background:#eff8ef;border-radius:12px;padding:14px;text-align:center}
.photo img{max-width:100%;max-height:260px;border-radius:10px;margin-top:10px}
.primary,.secondary,.danger{width:100%;border:0;border-radius:11px;padding:14px;margin-top:10px;font-size:16px;font-weight:bold}
.primary{background:#174a7c;color:white}.secondary{background:#e7eef6;color:#174a7c}.danger{background:#fee2e2;color:#b91c1c}
.entry{border:1px solid #dbe3ec;border-radius:12px;padding:12px;margin:10px 0;background:#fafcff}
.entry b{color:#174a7c}.small{font-size:12px;color:#64748b}

.login-screen{position:fixed;inset:0;background:#f4f7fb;display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0002}
.login-card h2{margin:0 0 6px;color:#174a7c;text-align:center}
.login-card p{margin:0 0 18px;text-align:center;color:#64748b;font-size:13px}
.login-card input{margin-bottom:10px}
.logout{background:#fee2e2!important;color:#b91c1c!important}

.hidden{display:none}.empty{text-align:center;padding:30px;color:#64748b}
.search{margin:0 0 12px}.search input{font-size:16px}.attach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.attach-card{border:1px solid #dbe3ec;border-radius:10px;padding:8px;background:#fff}.attach-card img{width:100%;height:120px;object-fit:cover;border-radius:8px}.attach-card a{display:block;padding:25px 5px;text-align:center;color:#174a7c;font-weight:bold;text-decoration:none}.attach-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2>🔐 Raid Report</h2>
    <p>कृपया User Name और Password डालकर Login करें</p>
    <label>User Name</label>
    <input id="loginUser" type="text" autocomplete="username" placeholder="User Name">
    <label>Password</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Password">
    <button class="primary" onclick="login()">🔓 Login</button>
    <div class="small" style="text-align:center;margin-top:10px">Default: <b>admin</b> / <b>1234</b></div>
    <div id="loginMsg" class="small" style="color:#b91c1c;text-align:center;margin-top:8px"></div>
  </div>
</div>

<header><h1>📋 Raid Report</h1><p>मोबाइल User-Friendly Entry App</p></header>
<nav>
<button id="newBtn" class="active" onclick="show('new')">➕ New Entry</button>
<button id="listBtn" onclick="show('list')">📑 Entries</button>
<button class="logout" onclick="logout()">🔒 Logout</button>
</nav>
<main>
<section id="new">
<div class="card">
<label>Date Of Raid</label><input id="date" type="date">
<label>Name & Address of Entity</label><textarea id="entity"></textarea>
<label>Description of Item Seized</label><textarea id="item"></textarea>
<label>Complainant Name</label><input id="complainant">
<label>Name of Accused Arrested</label><textarea id="accused"></textarea>
<label>Police permission for raid given by</label><input id="permission">
<label>Police Officials</label><textarea id="officials"></textarea>
<label>FIR Registration no & section applied</label><textarea id="fir"></textarea>
<label>Police Station Name</label><input id="station">

<label>📎 Photos / PDFs</label>
<div class="photo">
<input id="attachments" type="file" accept="image/*,application/pdf" multiple onchange="previewAttachments(event)">
<div id="attachmentPreview" class="attach-grid"></div>
<div id="photoText" class="small">Gallery से एक साथ कई फोटो/PDF चुनें</div>
</div>

<button class="primary" onclick="saveEntry()">💾 Save New Entry</button>
<button class="secondary" onclick="clearForm()">🧹 Clear Form</button>
</div>
</section>

<section id="list" class="hidden">
<div class="card">
<h3 style="margin-top:0">📑 Saved Entries</h3>
<div class="search"><input id="searchBox" placeholder="🔎 Search Entry, नाम, थाना, FIR, तारीख..." oninput="render()"></div>
<div id="entries"></div>
<button class="primary" onclick="exportExcel()">📊 Export to Excel (.xlsx)</button>
<button class="secondary" onclick="exportPDF()">📄 Export to PDF</button>
<button class="secondary" onclick="exportCSV()">📤 Export to CSV</button>
<button class="danger" onclick="deleteAll()">🗑️ Delete All Entries</button>
<button class="secondary" onclick="changePassword()">🔑 Change Password</button>
</div>
</section>
</main>

<script>
const DEFAULT_USER='admin';
const DEFAULT_PASS='1234';

function getLoginUser(){
  return localStorage.getItem('raidLoginUser') || DEFAULT_USER;
}
function getLoginPass(){
  return localStorage.getItem('raidLoginPass') || DEFAULT_PASS;
}
function login(){
  const u=(document.getElementById('loginUser').value||'').trim();
  const p=document.getElementById('loginPass').value||'';
  const msg=document.getElementById('loginMsg');
  if(u===getLoginUser() && p===getLoginPass()){
    sessionStorage.setItem('raidLoggedIn','1');
    document.getElementById('loginScreen').style.display='none';
    msg.textContent='';
  }else{
    msg.textContent='User Name या Password गलत है।';
  }
}
function logout(){
  sessionStorage.removeItem('raidLoggedIn');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginPass').value='';
}
function changePassword(){
  if(sessionStorage.getItem('raidLoggedIn')!=='1') return;
  const oldPass=prompt('वर्तमान Password डालें:');
  if(oldPass!==getLoginPass()){ alert('वर्तमान Password गलत है।'); return; }
  const newPass=prompt('नया Password डालें (कम से कम 4 अक्षर):');
  if(!newPass || newPass.length<4){ alert('Password कम से कम 4 अक्षर का होना चाहिए।'); return; }
  localStorage.setItem('raidLoginPass',newPass);
  alert('Password सफलतापूर्वक बदल दिया गया।');
}
function requireLogin(){
  if(sessionStorage.getItem('raidLoggedIn')==='1'){
    document.getElementById('loginScreen').style.display='none';
  }
}
window.addEventListener('load', requireLogin);
</script>

<script>
let attachmentsData=[];
function show(x){
 document.getElementById('new').classList.toggle('hidden',x!=='new');
 document.getElementById('list').classList.toggle('hidden',x!=='list');
 document.getElementById('newBtn').classList.toggle('active',x==='new');
 document.getElementById('listBtn').classList.toggle('active',x==='list');
 if(x==='list') render();
}
function previewAttachments(e){
 attachmentsData=[];
 const files=Array.from(e.target.files||[]);
 if(!files.length){renderAttachmentPreview();return}
 let done=0;
 files.forEach(f=>{
  const r=new FileReader();
  r.onload=()=>{attachmentsData.push({name:f.name,type:f.type,data:r.result});done++;if(done===files.length)renderAttachmentPreview()};
  r.readAsDataURL(f);
 });
}
function renderAttachmentPreview(){
 const box=document.getElementById('attachmentPreview');
 box.innerHTML=attachmentsData.map((f,i)=>f.type.startsWith('image/')
  ? `<div class="attach-card"><img src="${f.data}"><div class="attach-name">${esc(f.name)}</div></div>`
  : `<div class="attach-card"><a href="${f.data}" target="_blank">📄 PDF<br><span class="attach-name">${esc(f.name)}</span></a></div>`).join('');
}
function val(id){return document.getElementById(id).value.trim()}
function saveEntry(){
 const entry={id:Date.now(),date:val('date'),entity:val('entity'),item:val('item'),complainant:val('complainant'),accused:val('accused'),permission:val('permission'),officials:val('officials'),fir:val('fir'),station:val('station'),attachments:attachmentsData};
 if(!entry.date && !entry.entity && !entry.item){alert('कम से कम Date या मुख्य विवरण भरें।');return}
 let a=JSON.parse(localStorage.getItem('raidEntries')||'[]');a.push(entry);localStorage.setItem('raidEntries',JSON.stringify(a));
 alert('✅ नई Entry सफलतापूर्वक Save हो गई।');clearForm();show('list');
}
function clearForm(){
 ['date','entity','item','complainant','accused','permission','officials','fir','station'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('attachments').value='';attachmentsData=[];document.getElementById('attachmentPreview').innerHTML='';document.getElementById('photoText').textContent='Gallery से एक साथ कई फोटो/PDF चुनें';
}
function render(){
 let a=JSON.parse(localStorage.getItem('raidEntries')||'[]'), box=document.getElementById('entries');
 const q=(document.getElementById('searchBox')?.value||'').trim().toLowerCase();
 const filtered=a.filter(e=>!q || [e.date,e.entity,e.item,e.complainant,e.accused,e.permission,e.officials,e.fir,e.station]
   .join(' ').toLowerCase().includes(q));
 if(!a.length){box.innerHTML='<div class="empty">अभी कोई Entry नहीं है।<br>ऊपर “New Entry” से पहली Entry बनाएं।</div>';return}
 if(!filtered.length){box.innerHTML='<div class="empty">🔎 कोई matching Entry नहीं मिली।</div>';return}
 box.innerHTML=filtered.slice().reverse().map((e)=>`<div class="entry">
 <b>Entry</b><div class="small">${e.date||''} ${e.station?'• '+esc(e.station):''}</div>
 <p><b>Entity:</b> ${esc(e.entity)}</p><p><b>Accused:</b> ${esc(e.accused)}</p>
 ${e.attachments?.length?'<div class="attach-grid">'+e.attachments.map(f=>f.type?.startsWith('image/')
 ? '<div class="attach-card"><img src="'+f.data+'"><div class="attach-name">'+esc(f.name)+'</div></div>'
 : '<div class="attach-card"><a href="'+f.data+'" target="_blank">📄 PDF<br><span class="attach-name">'+esc(f.name)+'</span></a></div>').join('')+'</div>':''}
 ${(!e.attachments && e.photo)?'<img src="'+e.photo+'" style="max-width:100%;max-height:140px;border-radius:8px">':''}
 <button class="danger" onclick="removeEntry(${e.id})">Delete</button></div>`).join('');
}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function removeEntry(id){let a=JSON.parse(localStorage.getItem('raidEntries')||'[]').filter(x=>x.id!==id);localStorage.setItem('raidEntries',JSON.stringify(a));render()}
function deleteAll(){if(confirm('सभी Entries हटानी हैं?')){localStorage.removeItem('raidEntries');render()}}
function exportCSV(){
 let a=JSON.parse(localStorage.getItem('raidEntries')||'[]');if(!a.length){alert('Export करने के लिए कोई Entry नहीं है।');return}
 let headers=['ID','Date','Entity','Item Seized','Complainant','Accused','Permission','Officials','FIR','Police Station'];
 let rows=a.map(e=>[e.id,e.date,e.entity,e.item,e.complainant,e.accused,e.permission,e.officials,e.fir,e.station]);
 let csv=[headers,...rows].map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\\n');
 let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),aTag=document.createElement('a');aTag.href=url;aTag.download='Raid_Report_Entries.csv';aTag.click();URL.revokeObjectURL(url);
}
</script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
function getEntries(){return JSON.parse(localStorage.getItem('raidEntries')||'[]')}
function exportExcel(){
 let a=getEntries(); if(!a.length){alert('Export करने के लिए कोई Entry नहीं है।');return}
 let rows=a.map((e,i)=>({
  'Entry No':i+1,'Date Of Raid':e.date,'Name & Address of Entity':e.entity,
  'Description of Item Seized':e.item,'Complainant Name':e.complainant,
  'Name of Accused Arrested':e.accused,'Police permission for raid given by':e.permission,
  'Police Officials':e.officials,'FIR Registration no & section applied':e.fir,
  'Police Station Name':e.station,'Attachments':(e.attachments||[]).length+' file(s)'
 }));
 let ws=XLSX.utils.json_to_sheet(rows);
 ws['!cols']=[{wch:10},{wch:15},{wch:35},{wch:35},{wch:25},{wch:30},{wch:30},{wch:35},{wch:35},{wch:25},{wch:18}];
 let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Raid Reports');
 XLSX.writeFile(wb,'Raid_Report_Entries.xlsx');
}
function exportPDF(){
 let a=getEntries(); if(!a.length){alert('Export करने के लिए कोई Entry नहीं है।');return}
 const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
 doc.setFontSize(16); doc.text('Raid Report Entries',14,15);
 doc.setFontSize(9); doc.text('Generated: '+new Date().toLocaleString(),14,21);
 let body=a.map((e,i)=>[
  i+1,e.date||'',e.station||'',e.entity||'',e.item||'',e.complainant||'',e.accused||'',e.fir||''
 ]);
 doc.autoTable({
  startY:26,
  head:[['No.','Date','Police Station','Entity / Address','Item Seized','Complainant','Accused','FIR / Section']],
  body:body,
  styles:{fontSize:7,cellPadding:2,overflow:'linebreak'},
  headStyles:{fontSize:7},
  margin:{left:8,right:8}
 });
 doc.save('Raid_Report_Entries.pdf');
}
</script>
</body></html>
